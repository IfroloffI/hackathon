# LLM для NPC «Хронолёта»: Ollama (qwen2.5:3b) + agent-service (контракт chronolet.llm/1).
# Игровой сервер работает на хосте: npm run build && npm start (порт 2567).
#
#   docker compose up -d           # первый раз — с интернетом: скачает образ и модель (~2 ГБ)
#   docker compose logs -f agent-service
#   docker compose stop ollama     # игра продолжит работать на заготовках
#
# На Mac Docker не использует GPU (Metal): быстрее нативная Ollama (`brew install ollama`,
# `ollama serve`, `ollama pull qwen2.5:3b`) и OLLAMA_URL=http://host.docker.internal:11434 docker compose up -d agent-service
services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Скачивает модель один раз; без интернета, если модель уже есть, просто завершается успешно.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ['/bin/sh', '-c', 'ollama list | grep -q "^$$MODEL" || ollama pull "$$MODEL"']
    restart: 'no'

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      SERVER_URL: ${SERVER_URL:-http://host.docker.internal:2567}
      LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:-dev-llm-token}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    # Linux: host.docker.internal → хост (на Mac/Windows работает и так).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  ollama:
